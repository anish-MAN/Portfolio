    <style>

      /* General Reset */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    line-height: 1.6;
}

/* Header */
header {
    background: #333;
    color: #fff;
    padding: 1rem 0;
}

#navContainer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 2rem;
    flex-wrap: wrap;
}

.navbar {
    list-style: none;
    display: flex;
    gap: 1rem;
}

.navbar .nav-link {
    color: #fff;
    text-decoration: none;
    font-size: 1.2rem;
    transition: color 0.3s;
}

.navbar .nav-link:hover {
    color: burlywood;
}

.header-text {
    text-align: center;
    margin-top: 1rem;
}

header h1 span {
    color: burlywood;
}

/* Contact Section */
#contactDiv {
    padding: 1rem;
    background: #f4f4f4;
}

#contactDiv .container {
    display: flex;
    flex-wrap: wrap;
    gap: 2rem;
    justify-content: space-around;
}

#contactDiv input,
#contactDiv textarea {
    width: 100%;
    padding: 0.5rem;
    margin-bottom: 1rem;
}

#contactDiv button {
    padding: 0.5rem 1rem;
    background: burlywood;
    color: #fff;
    border: none;
    cursor: pointer;
}

#contactDiv button:hover {
    background: #333;
}

#contactDiv .container2 {
  margin-top: 10%;
}

#contactDiv .container2 button a {
    text-decoration: none;
    color: #fff;
}

#contactDiv .container2 h3 a{
    text-decoration: none;
    color: burlywood;
}

#contactDiv .container2 h3,
#contactDiv .container2 p {
    margin-bottom: 1rem;
}

/* Footer */
.footer {
    background: #333;
    color: #fff;
    text-align: center;
    padding: 1rem 0;
}
