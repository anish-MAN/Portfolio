<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Contact Anish Maurya, a frontend developer from India. Reach out via email or social media.">
  <meta name="keywords" content="Anish Maurya, Frontend Developer, Contact, Email, Social Media">
  <title>Contact Anish Maurya</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <style>
    /* General Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
    }

    /* Header */
    header {
      background: #333;
      color: #fff;
      padding: 1rem 0;
    }

    #navContainer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 2rem;
      flex-wrap: wrap;
    }

    .navbar {
      list-style: none;
      display: flex;
      gap: 1rem;
    }

    .navbar .nav-link {
      color: #fff;
      text-decoration: none;
      font-size: 1.2rem;
      transition: color 0.3s;
    }

    .navbar .nav-link:hover {
      color: burlywood;
    }

    .header-text {
      text-align: center;
      margin-top: 1rem;
    }

    header h1 span {
      color: burlywood;
    }

    /* Contact Section */
    #contactDiv {
      padding: 1rem;
      background: #f4f4f4;
    }

    #contactDiv .container {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      justify-content: space-around;
    }

    #contactDiv input,
    #contactDiv textarea {
      width: 100%;
      padding: 0.5rem;
      margin-bottom: 1rem;
      border: 1px solid #ddd;
    }

    #contactDiv button {
      padding: 0.5rem 1rem;
      background: burlywood;
      color: #fff;
      border: none;
      cursor: pointer;
    }

    #contactDiv button:hover {
      background: #333;
    }

    #contactDiv .container2 {
      margin-top: 10%;
    }

    #contactDiv .container2 button a {
      text-decoration: none;
      color: #fff;
      padding: 0.5rem 1rem;
      border-radius: 4px;
    }

    #contactDiv .container2 h3 a {
      text-decoration: none;
      color: burlywood;
    }

    #contactDiv .container2 h3,
    #contactDiv .container2 p {
      margin-bottom: 1rem;
    }

    /* Footer */
    .footer {
      background: #333;
      color: #fff;
      text-align: center;
      padding: 1rem 0;
    }

    /* Menu Button for Mobile */
.menu-btn {
    background: none;
    border: none;
    font-size: 1.8rem;
    color: #fff;
    cursor: pointer;
    display: none;
}

/* Responsive Styles */
@media (max-width: 768px) {
    .menu-btn {
        display: block;
        position: absolute;
        right: 20px;
        top: 20px;
    }

    .navbar {
        display: none;
        flex-direction: column;
        background: #333;
        width: 100%;
        position: absolute;
        top: 60px;
        left: 0;
        padding: 1rem;
    }

    .navbar.show {
        display: flex;
    }

    .nav-item {
        text-align: center;
        padding: 0.5rem 0;
    }
}
  </style>
</head>

<body>

  <header>
    <nav id="navbarTop">
      <div id="navContainer">
        <!-- Menu Button for Mobile -->
        <button id="menuBtn" class="menu-btn">&#9776;</button>
        
        <!-- Navigation Links -->
        <ul class="navbar" id="navLinks">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="index.html">About</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="services.html">Service</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="projects.html">Projects</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="contact.html">Contact</a>
          </li>
        </ul>
        
        <div class="header-text">
          <p>Frontend Developer</p>
          <h1>Hi, I'm <span style="color: burlywood;">Anish Maurya</span></h1>
          <p>Mumbai, India</p>
        </div>
      </div>
    </nav>
  </header>

  <div id="contactDiv">
    <div class="container">
      <div class="container1">
        <h1>Contact Me</h1>
        <form method="post" id="Contactform">
          <label for="name">Name: </label>
          <input type="text" name="userName" id="name" placeholder="Enter your name" required> <br> <br>
          <label for="contact">Contact no: </label>
          <input type="tel" name="contact" id="contact" placeholder="Enter your contact no" required> <br> <br>
          <label for="email">E-mail: </label>
          <input type="email" name="email" id="email" placeholder="Enter your Email" required> <br> <br>
          <label for="message">Message: </label>
          <textarea name="message" id="message" placeholder="Enter your message" required></textarea> <br> <br>
          <button type="submit">Submit</button>
        </form>
      </div>

      <div class="container2">
        <h3><a href="mailto:anishmauryaa@gmail.com">anishmauryaa@gmail.com</a></h3>
        <p>+91-9325207005</p>
        <button onclick=" window.location.href='https://www.instagram.com/anish__maurya__' "><i class="fa-brands fa-instagram"></i></button>
        <button onclick=" window.location.href='https://wa.me/+919325207005?text=Hi,I want a website developer' "><i class="fa-brands fa-whatsapp"></i></button>
        <button onclick=" window.location.href='https://www.github.com/anish-MAN' "><i class="fa-brands fa-github"></i></button>
        <button onclick=" window.location.href='https://www.linkedin.com/in/anish-maurya-406473274' "><i class="fa-brands fa-linkedin"></i></button>
      </div>
    </div>
  </div>

  <div class="footer">
    <p>All Copyrights Reserved To Anish Maurya, Any Reuse Without Permission Is Prohibited.</p>
  </div>

  <script>

      document.getElementById("menuBtn").addEventListener("click", function () {
        document.getElementById("navLinks").classList.toggle("show");
      });
  

    const form = document.querySelector("#Contactform");
  
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      sendData();
    });
  
    function sendData() {
      // if (!name.value || !contact.value || !email.value || !message.value) {
      //   alert("Please fill in all fields.");
      //   return;
      // }
  
      fetch("https://sheetdb.io/api/v1/9vf3b42cs6q71", {
        method: "POST",
        headers: {
          "Accept": "application/json",
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          data: [
            {
              "id": "INCREMENT",
              "contactName": form.userName.value,
              "contact": form.contact.value,
              "email": form.email.value,
              "message": form.message.value,
            },
          ],
        }),
      })
        .then((response) => response.json())
        .then((data) => {
          console.log(data);
          alert("Form submitted successfully!");
          form.reset();
        })
        .catch((error) => console.error("Error:", error));
    }
  </script>

</body>
</html>
